schema_version: 1
id: 22222222-2222-4222-8222-222222222222
task: detection

runtime:
  device: cpu
  mixed_precision: false

model:
  format: torch_checkpoint
  mode: from_scratch
  trainable: all
  source:
    kind: local
    path: models/detector.pt
  torch:
    weights: state_dict
    architecture:
      class_path: training.tiny_detector.TinyDetector
      params:
        num_classes: 2
        grid_size: 8

data:
  source:
    kind: local
    root: data/detection
    images_dir: images
    annotations_dir: annotations
  annotation: boxes
  val_ratio: 0.2
  seed: 7
  num_workers: 0

preparation:
  image_size: [128, 128]
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip: true
    flip_probability: 0.5

training:
  epochs: 10
  batch_size: 4
  resume: false
  checkpoint_every: 1

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01

loss:
  name: grid_detection
  box_weight: 1.0

persistence:
  kind: local
  root: artifacts/detection
