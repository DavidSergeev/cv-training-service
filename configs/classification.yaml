schema_version: 1
id: 11111111-1111-4111-8111-111111111111
task: classification

runtime:
  device: cpu
  mixed_precision: false

# google/mobilenet_v2_1.0_224 expects 224x224 ImageNet-normalized images.
# Another Hub image classifier uses the same block with its own repo_id,
# num_labels, and preparation.image_size.
model:
  format: huggingface
  mode: finetune
  trainable: head_only
  source:
    kind: huggingface
    repo_id: google/mobilenet_v2_1.0_224
    revision: main
  huggingface:
    task: image-classification
    num_labels: 3
    ignore_mismatched_sizes: true

# beans has an image column and a 3-class labels column, so it matches the
# MobileNet head above. The same source fields point at another Hub dataset
# when that dataset exposes an image column and an integer label column.
data:
  source:
    kind: huggingface
    repo_id: AI-Lab-Makerere/beans
    revision: main
    split: train
    image_column: image
    label_column: labels
    max_samples: 8
  annotation: label
  val_ratio: 0.2
  seed: 7
  num_workers: 0

preparation:
  # 128 keeps this smoke run short. Use 224 for a real MobileNetV2 fine-tune.
  image_size: [128, 128]
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip: true
    flip_probability: 0.5

training:
  epochs: 1
  batch_size: 4
  resume: false
  checkpoint_every: 1

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01

loss:
  name: cross_entropy

persistence:
  kind: local
  root: artifacts/classification
